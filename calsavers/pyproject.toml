[project]
name = "calsavers-remit"
version = "0.1.0"
description = "Pull Gusto payroll deductions and emit a CalSavers-ready contribution file."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary — internal use only" }
authors = [{ name = "Nick Hormuth", email = "nick@sfbiketours.com" }]

dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[project.scripts]
calsavers-remit = "calsavers_remit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calsavers_remit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
